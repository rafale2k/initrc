
name: Build Release

on:
  push:
    tags:
      - 'v*'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Changelog for this version
        id: extract_changelog
        run: |
          python3 -c "
          import sys
          import re

          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  lines = f.readlines()
          except FileNotFoundError:
              lines = []

          extracted = []
          in_block = False

          for line in lines:
              if re.match(r'^[# ]*\[v|^## \[v', line):
                  if in_block:
                      break
                  in_block = True
              if in_block:
                  extracted.append(line)

          # 100行を超えていたら20行に強制カット
          if len(extracted) > 100:
              extracted = extracted[:20]

          with open('RELEASE_NOTE.md', 'w', encoding='utf-8') as f:
              f.writelines(extracted)
          "
          echo "--- DEBUG: FINAL CONTENT ---"
          cat RELEASE_NOTE.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # 全体ではなく、切り出した RELEASE_NOTE.md を使う
          body_path: RELEASE_NOTE.md 
          draft: false
          prerelease: false
